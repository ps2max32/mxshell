# .github/workflows/ps2.yml of ps2max32/mxshell, mx OS's shell.
# Every push and PR: build MXSHELL.ELF and the storage drivers it loads with
# ghcr.io/ps2max32/ps2max, as an artifact.
name: ps2

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-26.04
    container: ghcr.io/ps2max32/ps2max:latest
    steps:
      - uses: actions/checkout@v7
      - name: Build
        run: make -j$(nproc) OUT=$PWD/out
      - uses: actions/upload-artifact@v7
        with:
          name: mxshell-${{ github.sha }}
          path: out/MXOS
          if-no-files-found: error
